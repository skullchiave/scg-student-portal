<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>e2e qsets import flow</title></head>
<body>
<iframe id="f" src="../src/master.html" width="1100" height="900"></iframe>
<pre id="out">RUNNING</pre>
<!-- 資格情報は file:// から .env を読めないので、run_e2e_qsets_import.py が書き出した tmp/e2e_creds.js から取る。
     ★無ければ window.__E2E_CREDS が undefined のままになる＝下の分岐で気づいて止まる（黙って落ちない）。 -->
<script src="../tmp/e2e_creds.js"></script>
<script>
/* 「問題の登録・解放」の回帰テスト（tests/run_e2e_qsets_import.py から起動）。パスワードは資格情報のみ .env 由来。
   教師画面を iframe でそのまま動かし、
     ログイン → ②取り込み(シート選択・重複ブロック) → ②プレビュー → ③1問ずつ修正
     → ④公開（本物のデモDBに書く） → 一覧に出るか確認 → 片付け（消す）
   まで実際に操作する。手本: e2e_quiz_flow.html（学生画面の小テスト往復）。

   ★<input type=file> へ合成の File を注入することはできないため、実ファイル選択の代わりに
   iframe内の window.loadWorkbook(workbook, filename) を直接呼ぶ。workbook 自体は iframe が
   読み込み済みの本物の SheetJS（w.XLSX）で組み立てるので、パース以降は実ファイル選択後と
   まったく同じコードパスを通る。

   ダミーの設問は test_choices.py --live の慣習に合わせ「ダミー設問」「えらぶN」を使う。
   タイトルは「🧪E2Eテストダミー」で始める＝取り違え防止と、後片付けの目印。
   ★このテストは本物のデモDB（Supabase）に書き込み、最後に自分で消す。 */
const out = document.getElementById("out"), log = { steps: [] };
const step = (name, ok, detail) => log.steps.push({ name, ok: !!ok, detail: detail === undefined ? "" : String(detail).slice(0, 260) });
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function until(fn, ms = 20000) { const t0 = Date.now(); while (Date.now() - t0 < ms) { try { if (fn()) return true; } catch (e) {} await sleep(150); } return false; }
const CREDS = window.__E2E_CREDS || null;

const HEAD = ["問題番号", "問題文1", "問題文2", "添付ファイル名",
  "選択肢1", "選択肢2", "選択肢3", "選択肢4", "選択肢5", "解説", "解答", "カテゴリ", "配点"];
function qrow(no, t2, choices, ans) {
  const ch = choices.concat(Array(5 - choices.length).fill(""));
  return [no, "", t2, "", ...ch, "", ans, "文法", 1];
}
const TITLE_PREFIX = "🧪E2Eテストダミー（自動で消えます）";

(async () => {
  if (!CREDS || !CREDS.masterPw) {
    log.error = "資格情報が読めません（tmp/e2e_creds.js が無いか不完全）。tests/run_e2e_qsets_import.py から起動してください。";
    out.textContent = "E2E_RESULT " + JSON.stringify(log);
    return;
  }
  const f = document.getElementById("f");
  /* 🔴「要素がある」を「準備できた」と読み替えないこと（2026-09-11 に踏んだ）。
     ログインボタンは静的HTMLなので最初から存在するが、その onclick は
     アプリの巨大なスクリプトの終盤で代入される。存在だけで待って押すと
     **押しても何も起きず、例外もエラー文言も出ない**。
     「ログインできない」ではなく「ログインしていない」まま先へ進み、
     あとから別の呼び出しが 401 になって、原因から遠い場所で落ちる。
     ★待ち時間を延ばして直したことにしない。競合であって遅さではない。 */
  await until(() => {
    const dd = f.contentDocument;
    const b = dd && dd.getElementById("btn-login");
    return !!b && typeof b.onclick === "function";
  });
  const w = f.contentWindow, d = f.contentDocument;
  try { w.localStorage.clear(); } catch (e) {}
  const $ = id => d.getElementById(id);

  // ---- ログイン ----
  /* ★2026-09-12 に画面を3つに分けたので、**マスター**でログインする。
     master.html は先生（t001）を断って teacher.html へ案内する作りになった。
     ここを t001 のままにすると「教師としてログインできる」から先が全部落ちる（実際に落ちた）。 */
  $("in-no").value = CREDS.masterNo; $("in-pw").value = CREDS.masterPw; $("btn-login").click();
  step("マスターとしてログインできる", await until(() => !$("scr-dash").hidden), $("login-msg").textContent);

  // ---- 「問題の登録・解放」タブへ ----
  d.querySelector('.nav [data-view="qsets"]').click();
  step("一覧の画面が出る", await until(() => !$("qs-pane-list").hidden));
  await until(() => $("qs-list-note").textContent !== "読み込み中…", 15000);
  step("一覧が読み込める（本物のDB・エラーでない）",
       !$("qs-list-note").textContent.includes("失敗"), $("qs-list-note").textContent);

  // ---- ①取り込み: 同じ課の範囲が2枚だと止まることを確認（重複ブロック）----
  $("qs-btn-new").click();
  step("①取り込み画面に入る", await until(() => !$("qs-step-1").hidden));
  {
    const wbDup = w.XLSX.utils.book_new();
    w.XLSX.utils.book_append_sheet(wbDup, w.XLSX.utils.aoa_to_sheet([HEAD, qrow(1, "ダミー設問1", ["えらぶ1", "えらぶ2"], 1)]), "①1-3");
    w.XLSX.utils.book_append_sheet(wbDup, w.XLSX.utils.aoa_to_sheet([HEAD, qrow(1, "ダミー設問1", ["えらぶ1", "えらぶ2"], 1)]), "①1-3 （新）");
    w.loadWorkbook(wbDup, "dup.xlsx");
    await until(() => d.querySelectorAll(".qs-sheet-chk").length === 2);
    step("重複するシートが2枚とも一覧に出る", d.querySelectorAll(".qs-sheet-chk").length === 2);
    step("★同じ課の範囲は「②プレビューへ」が押せない", $("qs-btn-to2").disabled, $("qs-step1-msg").textContent);
    step("止めた理由が画面に出る", $("qs-step1-msg").textContent.includes("同じ課の範囲"));
    d.querySelectorAll(".qs-sheet-chk")[1].click();   // 「（新）」の方を外す
    await sleep(100);
    step("★1枚に絞れば進めるようになる", !$("qs-btn-to2").disabled);
  }

  // ---- ①取り込み（本番）: ダミー設問2問の1シートを読ませる ----
  $("qs-file").value = "";
  const wb = w.XLSX.utils.book_new();
  const rows = [HEAD,
    qrow(1, "ダミー設問1", ["えらぶ1", "えらぶ2", "えらぶ3"], 2),
    qrow(2, "ダミー設問2", ["えらぶA", "えらぶB"], 1)];
  w.XLSX.utils.book_append_sheet(wb, w.XLSX.utils.aoa_to_sheet(rows), "①1-3");
  $("qs-prefix").value = TITLE_PREFIX;
  w.loadWorkbook(wb, "e2e-dummy.xlsx");
  await until(() => d.querySelectorAll(".qs-sheet-chk").length === 1);
  step("1シートだけの取り込みでは即座に次へ進める", !$("qs-btn-to2").disabled);

  // ---- ②プレビュー ----
  $("qs-btn-to2").click();
  step("②プレビュー画面に入る", await until(() => !$("qs-step-2").hidden));
  await until(() => $("qs-preview-list").textContent.includes("ダミー設問1"));
  step("プレビューに2問とも出る",
       $("qs-preview-list").textContent.includes("ダミー設問1") && $("qs-preview-list").textContent.includes("ダミー設問2"));
  step("不備0件で取り込める", $("qs-preview-kpi").textContent.includes("2") && !d.querySelector(".qs-q.ng"));

  // ---- ③1問ずつ修正: 1問目の設問文と正解を変える ----
  $("qs-btn-to3").click();
  step("③修正画面に入る", await until(() => !$("qs-step-3").hidden));
  await until(() => $("qs-ef-prompt") && $("qs-ef-prompt").value.includes("ダミー設問1"));
  $("qs-ef-prompt").value = "ダミー設問1（直した）";
  const radios = [...d.querySelectorAll("input[name='qs-ef-correct']")];
  step("正解のラジオボタンが選択肢の数だけある", radios.length === 3, radios.length);
  radios[2].click();   // 3番目を正解に変える（元は2番目）
  $("qs-ef-next").click();
  await sleep(150);
  step("次の問題（2問目）に進める", $("qs-edit-nav").textContent.includes("2 / 2"));
  $("qs-ef-prev").click();
  await sleep(150);
  step("前の問題（1問目）に戻ると直した設問文が残っている",
       $("qs-ef-prompt").value === "ダミー設問1（直した）", $("qs-ef-prompt").value);

  // ---- ②プレビューへ戻る: 直したものが反映されているか ----
  $("qs-btn-to2b").click();
  await until(() => !$("qs-step-2").hidden);
  await sleep(150);
  step("★修正がプレビューに反映される（直した設問文が出る）",
       $("qs-preview-list").textContent.includes("ダミー設問1（直した）"));
  step("修正していない2問目はそのまま出る（上書きされていない）",
       $("qs-preview-list").textContent.includes("ダミー設問2"));

  // ---- ④登録（★下書きで入る。取り込んだ瞬間に学生へ出ないこと） ----
  $("qs-btn-to3").click(); await until(() => !$("qs-step-3").hidden);
  $("qs-btn-to4").click();
  step("④登録画面に入る", await until(() => !$("qs-step-4").hidden));
  step("登録対象が1回・2問と出る", $("qs-publish-summary").textContent.includes("2"));
  $("qs-btn-publish").click();
  step("登録できる（本物のデモDBに書き込み）",
       await until(() => $("qs-publish-msg").textContent.includes("登録しました"), 20000),
       $("qs-publish-msg").textContent);

  // ---- 一覧に出るか（読み戻し）----
  step("登録後に一覧へ戻る", await until(() => !$("qs-pane-list").hidden, 5000));
  await until(() => $("qs-list-tbl").textContent.includes(TITLE_PREFIX), 8000);
  const rowOf = () => Array.from($("qs-list-tbl").querySelectorAll("tr[data-qsid]"))
    .filter(tr => tr.textContent.includes(TITLE_PREFIX))[0];
  step("★取り込んだ直後は「下書き」＝学生にはまだ見えない",
       !!rowOf() && rowOf().textContent.includes("下書き"),
       rowOf() ? rowOf().textContent.slice(0, 80) : "行が無い");

  /* 🔴 行の操作ボタンが**縦に積まれていない**こと（2026-09-13 に撮って気づいた）。
     app.css の .btn はスマホ向けに display:block なので、表のセルの中では1つずつ改行される。
     そうなると1行が3段になり、一覧に6行しか入らない（14行入るはずが）。
     ★「押せるか」は通るのに「並びが壊れている」＝**検査からは見えない**類なので、位置を測る。 */
  {
    const acts = rowOf() && rowOf().querySelector(".qs-act");
    const btns = acts ? [...acts.querySelectorAll(".btn")] : [];
    const tops = new Set(btns.map(b => Math.round(b.getBoundingClientRect().top)));
    step("🔴★行の操作ボタンが1行に並んでいる（縦に積まれていない）",
         btns.length >= 2 && tops.size === 1,
         btns.length + "個 / 段数 " + tops.size);
    step("★行に置くのは3つだけ（はじめる・公開・編集）", btns.length === 3,
         btns.map(b => b.textContent.trim()).join(" / "));
  }

  // ---- 公開／停止のトグル ----
  // ★2026-09-11 から確認は自前の <dialog>（askDialog）。**window.confirm は使っていない**ので、
  //   差し替えでは通らない。実際に画面に出た OK ボタンを押す。
  //   ⚠ 押す前に「ダイアログが本当に出たか」も確かめる＝出ないまま次へ進むのを防ぐ。
  let dlgPlaceChecked = false;
  const pressOk = async (what) => {
    const shown = await until(() => { const d0 = $("cfm-dlg"); return d0 && d0.open; }, 10000);
    step("★" + what + "の前に確認ダイアログが出る", shown,
         shown ? $("cfm-dlg").textContent.replace(/\s+/g, " ").slice(0, 70) : "出なかった");
    /* 🔴 まん中に出ているか（2026-09-13 きあ報告）。
       app.css の *{margin:0} が、ブラウザ標準の dialog:modal{margin:auto} を打ち消すと
       **画面の左上に貼り付く**。見た目の戻りは静かに起きるので、位置そのものを測る。 */
    if (shown && !dlgPlaceChecked) {
      dlgPlaceChecked = true;
      const r = $("cfm-dlg").getBoundingClientRect();
      const vw = d.documentElement.clientWidth, vh = d.documentElement.clientHeight;
      const dx = Math.abs((r.left + r.right) / 2 - vw / 2);
      const dy = Math.abs((r.top + r.bottom) / 2 - vh / 2);
      step("🔴★確認ダイアログが画面のまん中に出る（左上に貼り付いていない）",
           r.width > 0 && dx < 40 && dy < 80,
           "中心のズレ x=" + Math.round(dx) + "px y=" + Math.round(dy) + "px / 画面 " + vw + "x" + vh);
    }
    if (shown) $("cfm-ok").click();
    return shown;
  };
  try {
    // ★画面の知らせを合図にする（＝一覧の読み直しが終わったあとに出る）。
    //   DOM を素で見張ると、--virtual-time-budget の下では読み直しと競合して当てにならない。
    rowOf().querySelector(".qs-toggle").click();
    await pressOk("公開");
    const okPub = await until(() => $("qs-list-msg").textContent.includes("公開しました"), 20000);
    // ★画面とDBの両方を見る。片方だけだと「DBは変わったのに画面が古い」を見逃す
    const inDb = await w.__e2e.get("/rest/v1/quiz_sets?select=id,is_open&" +
      "title=like." + encodeURIComponent(TITLE_PREFIX + "*"));
    // 🔴 **画面の行数と、一覧が受け取った件数が一致すること。**
    //   古い行が残っても「新しい行はある」ので、行の中身だけ見ていると気づけない。
    //   2026-09-11 に、再描画のたびに古い行が1行ずつ生き残る作りを踏んだ（DOM 14行 / DB 4件）。
    const onScreen = $("qs-list-tbl").querySelectorAll("tr[data-qsid]").length;
    const received = (w.__e2e.lastSets || []).length;
    step("★一覧の行数が、受け取った件数とぴったり同じ（古い行が残っていない）",
         onScreen === received && received > 0, "画面 " + onScreen + "行 / 受け取り " + received + "件");
    step("★「公開」を押すと、DBも一覧の表示も公開中になる",
         okPub && !!rowOf() && rowOf().textContent.includes("公開中") &&
         inDb.length === 1 && inDb[0].is_open === true,
         "画面=" + (rowOf() ? rowOf().textContent.slice(0, 50) : "無し") +
         " / DB=" + JSON.stringify(inDb.map(r => r.is_open)) +
         " / 知らせ=" + $("qs-list-msg").textContent.slice(0, 40));

    rowOf().querySelector(".qs-toggle").click();
    await pressOk("停止");
    const okStop = await until(() => $("qs-list-msg").textContent.includes("停止しました"), 20000);
    const inDb2 = await w.__e2e.get("/rest/v1/quiz_sets?select=id,is_open&" +
      "title=like." + encodeURIComponent(TITLE_PREFIX + "*"));
    step("★「停止」を押すと、DBも一覧の表示も下書きに戻る",
         okStop && !!rowOf() && rowOf().textContent.includes("下書き") &&
         inDb2.length === 1 && inDb2[0].is_open === false,
         "画面=" + (rowOf() ? rowOf().textContent.slice(0, 50) : "無し") +
         " / DB=" + JSON.stringify(inDb2.map(r => r.is_open)));
  } finally { /* 差し替えは無いので戻すものも無い */ }

  // ═══ 登録ずみの回を「編集」する（2026-09-13 追加）═══════════════════════════
  // ★ここを通す検査が無いまま出すと、「作った機能の経路を1本も通していない」ことになる。
  //   とくに 🔴 **選択肢を減らしたときに正解の行が道連れで消えないか** は要。
  //   question_answers は (question_id, correct_idx) → question_choices(question_id, idx) の
  //   外部キーを **ON DELETE CASCADE** で持っているので、消す順番を間違えると
  //   **正解の行ごと黙って消える**（そうなった設問は受けた全員が不正解になる）。
  {
    /* 検索欄でしぼる。★入力は 300ms 待ってから効く作りなので、
       「入れた直後」を見ると前の一覧のままで、まとめて操作の対象を取り違える。 */
    const setFilter = async (q) => {
      $("qs-filter-q").value = q;
      $("qs-filter-q").dispatchEvent(new w.Event("input", { bubbles: true }));
      await sleep(500);
      await until(() => {
        const note = $("qs-list-note").textContent || "";
        return q ? note.includes("しぼり") : !note.includes("しぼり");
      }, 15000);
    };
    const backToList = async () => {
      await until(() => !$("qs-pane-list").hidden, 10000);
      await until(() => $("qs-list-tbl").textContent.includes(TITLE_PREFIX), 10000);
    };
    const openEdit = async () => {
      rowOf().querySelector(".qs-edit").click();
      await until(() => !$("qs-step-3").hidden && !$("qs-edit-actions").hidden, 15000);
      return await until(() => $("qs-edit-form").querySelector("#qs-ef-prompt"), 15000);
    };
    const setId = rowOf().getAttribute("data-qsid");
    const dbQ = async () => await w.__e2e.get(
      "/rest/v1/questions?select=id,seq,prompt&quiz_set_id=eq." + encodeURIComponent(setId) + "&order=seq.asc");

    step("一覧の行に「編集」のボタンがある", !!rowOf().querySelector(".qs-edit"));
    step("編集の画面に入れて、DBから設問を読み込めた", await openEdit());
    step("★①②③④の段は出さない＝取り込みの途中と見分けがつく", $("qs-steps").hidden);
    step("見出しが「設問を直す」になる",
         $("qs-step3-h").textContent.includes("設問を直す"), $("qs-step3-h").textContent);
    step("★誰も受けていないことが画面に出る",
         $("qs-edit-warn").textContent.includes("まだ誰も受けていません"),
         $("qs-edit-warn").textContent.replace(/\s+/g, " ").slice(0, 70));
    step("★設問の追加・削除ができると画面に書いてある",
         $("qs-edit-warn").textContent.includes("設問そのものの追加と削除"));

    const before = await dbQ();
    step("読み込んだ設問数が、登録した数と同じ", before.length === 2, before.length + "問");

    // ---- ① 設問文と正解を直して保存 → DBに入っているか ----
    const NEWP = "【編集e2e】直した設問文";
    $("qs-ef-prompt").value = NEWP;
    const radios = Array.from(d.querySelectorAll("input[name='qs-ef-correct']"));
    step("正解のラジオが選択肢の数だけ出る", radios.length === 3, radios.length);
    radios[2].checked = true;                       // 3番目を正解にする
    $("qs-btn-save").click();
    step("保存できた（下書き・受験0件なので確認は出ない）",
         await until(() => $("qs-edit-msg").textContent.includes("保存しました"), 20000),
         $("qs-edit-msg").textContent);
    await backToList();

    const q1 = await dbQ();
    step("★直した設問文が、DBに入っている",
         q1.length === 2 && q1[0].prompt === NEWP, q1.length ? q1[0].prompt.slice(0, 30) : "無し");
    const a1 = await w.__e2e.get(
      "/rest/v1/question_answers?select=question_id,correct_idx&question_id=eq." + encodeURIComponent(q1[0].id));
    step("★直した正解が、DBに入っている（3番）",
         a1.length === 1 && a1[0].correct_idx === 3, JSON.stringify(a1.map(r => r.correct_idx)));

    // ---- ② 空の選択肢では保存させない ----
    step("もう一度 編集に入れる", await openEdit());
    const chs = Array.from(d.querySelectorAll(".qs-ef-choice"));
    const keep = chs[1].value;
    chs[1].value = "   ";                            // 空白だけ＝空あつかい
    $("qs-btn-save").click();
    step("★空の選択肢があると保存を止める",
         await until(() => $("qs-edit-msg").textContent.includes("空の選択肢"), 10000),
         $("qs-edit-msg").textContent);
    chs[1].value = keep;                             // 戻す

    // ---- ③ 選択肢を3→2に減らす（★正解の行が道連れで消えないか）----
    $("qs-ef-delchoice").click();                    // 3個 → 2個。正解は2へ寄せられる
    step("選択肢が2個になった", d.querySelectorAll(".qs-ef-choice").length === 2,
         d.querySelectorAll(".qs-ef-choice").length);
    $("qs-btn-save").click();
    step("減らした状態で保存できた",
         await until(() => $("qs-edit-msg").textContent.includes("保存しました"), 20000),
         $("qs-edit-msg").textContent);
    await backToList();

    const q2 = await dbQ();
    const c2 = await w.__e2e.get(
      "/rest/v1/question_choices?select=question_id,idx,label&question_id=eq." + encodeURIComponent(q2[0].id) + "&order=idx.asc");
    step("★選択肢がDBでも2個になっている", c2.length === 2, JSON.stringify(c2.map(r => r.idx)));
    const a2 = await w.__e2e.get(
      "/rest/v1/question_answers?select=question_id,correct_idx&question_id=eq." + encodeURIComponent(q2[0].id));
    // 🔴 ここが本命。消す順番を間違えると、この行が CASCADE で消えて 0 件になる
    step("🔴★選択肢を減らしても『正解』の行が消えていない（ON DELETE CASCADE の罠）",
         a2.length === 1, a2.length + "件");
    step("★正解が、残っている選択肢の中を指している",
         a2.length === 1 && a2[0].correct_idx >= 1 && a2[0].correct_idx <= 2,
         a2.length ? String(a2[0].correct_idx) : "無し");

    // ---- ④ 選択肢の増減はいつでも押せる（2026-09-13 にきあ判断で制限を外した）----
    step("★選択肢を増減するボタンが押せる",
         await openEdit() && !$("qs-ef-addchoice").disabled && !$("qs-ef-delchoice").disabled);

    // ---- ⑤ 設問を足す（末尾）----
    const nBefore = (await dbQ()).length;
    $("qs-btn-addq").click();
    step("★足した設問は「まだ保存していません」と分かる",
         await until(() => $("qs-edit-nav").textContent.includes("まだ保存していません"), 8000),
         $("qs-edit-nav").textContent.replace(/\s+/g, " ").slice(0, 70));
    const newChs = Array.from(d.querySelectorAll(".qs-ef-choice"));
    step("足した設問は選択肢2つで始まる", newChs.length === 2, newChs.length);
    $("qs-ef-prompt").value = "【編集e2e】足した設問";
    newChs[0].value = "え1"; newChs[1].value = "え2";
    const r1 = d.querySelector("input[name='qs-ef-correct'][value='1']");
    if (r1) r1.checked = true;
    $("qs-btn-save").click();
    step("足した状態で保存できた",
         await until(() => $("qs-edit-msg").textContent.includes("保存しました"), 20000),
         $("qs-edit-msg").textContent);
    await backToList();

    const q3 = await dbQ();
    step("★DBの設問が1問ふえている", q3.length === nBefore + 1, nBefore + " → " + q3.length);
    const addedQ = q3[q3.length - 1];
    const ac = await w.__e2e.get(
      "/rest/v1/question_choices?select=idx&question_id=eq." + encodeURIComponent(addedQ.id));
    const aa = await w.__e2e.get(
      "/rest/v1/question_answers?select=correct_idx&question_id=eq." + encodeURIComponent(addedQ.id));
    step("★足した設問に、選択肢2つと正解がそろって入っている",
         ac.length === 2 && aa.length === 1, "選択肢" + ac.length + "／正解" + aa.length);

    // ---- ⑥ 設問を消す（★押した時点では消さない・保存で消える）----
    step("編集に入り直す（消す前）", await openEdit());
    $("qs-ef-next").click(); $("qs-ef-next").click();
    step("いちばん後ろの設問に移動できた",
         $("qs-edit-nav").textContent.includes("3 / 3"),
         $("qs-edit-nav").textContent.replace(/\s+/g, " ").slice(-28));
    $("qs-btn-delq").click();
    await pressOk("設問を消す");
    step("★消しても、保存するまでは消えないと画面に出る",
         await until(() => $("qs-edit-warn").textContent.includes("保存すると 1問 が消えます"), 8000),
         $("qs-edit-warn").textContent.replace(/\s+/g, " ").slice(-70));
    const stillThere = await dbQ();
    step("★★保存を押す前は、DBはまだ減っていない",
         stillThere.length === nBefore + 1, stillThere.length + "問");
    $("qs-btn-save").click();
    await pressOk("消しての保存");
    step("消した状態で保存できた",
         await until(() => $("qs-edit-msg").textContent.includes("保存しました"), 20000),
         $("qs-edit-msg").textContent);
    await backToList();
    const q4 = await dbQ();
    step("★DBの設問が元の数に戻った", q4.length === nBefore, q4.length + "問");
    const goneC = await w.__e2e.get(
      "/rest/v1/question_choices?select=idx&question_id=eq." + encodeURIComponent(addedQ.id));
    step("★消した設問の選択肢も残っていない", goneC.length === 0, goneC.length + "件");

    // ---- ⑦ Excel に書き出して、そのまま取り込み直せるか（2026-09-13 きあ依頼）----
    // ★きあの言葉:「万が一正本がぶっ壊れても復帰できるようにしておきたい」
    //   ＝ 書き出せることではなく、**書き出したものが戻せること** が要件。
    //   落としたファイル自体はブラウザの外へ出てヘッドレスから触れないので、
    //   **ブックを作るところまで**を取り出して、それを取り込み口に食わせ直して突き合わせる。
    {
      /* ★ボタンそのものを押す。下の往復（buildWb）はブックを作るだけ＝ボタンを通っていない。
         2026-09-13 に、押していないのに「履歴に export がある」を確かめようとして落ちた。
         ★同じ日にきあ指摘で単位を変えた＝「表示中の50件」ではなく **教科書（教材）** をえらぶ。
           50件は「もっと見る」を押す前の1ページ分で、控えの単位にならないため。 */
      $("qs-btn-export").click();
      step("★Excelの書き出しで、教科書をえらぶ画面が出る",
           await until(() => { const dl = $("xlsx-dlg");
                               return dl && dl.open && d.querySelectorAll(".xlsx-book").length > 0; }, 25000),
           d.querySelectorAll(".xlsx-book").length + "教材");
      step("★教科書ごとに「◯回 / ◯問」が出る",
           /\d+回\s*\/\s*\d+問/.test($("xlsx-books").textContent),
           $("xlsx-books").textContent.replace(/\s+/g, " ").slice(0, 80));
      step("🔴★何も選ばなければ「全部」になる（きあ指示）",
           $("xlsx-sum").textContent.includes("全部") && $("xlsx-ok").textContent.includes("全部"),
           $("xlsx-sum").textContent.replace(/\s+/g, " ").slice(0, 60) + " / ボタン=" + $("xlsx-ok").textContent);

      // ダミーは source_book を持たないので「教材が入っていない回」に入る。そこだけ選ぶ
      const noBook = [...d.querySelectorAll(".xlsx-book")].filter(c => c.value === "")[0];
      step("「教材が入っていない回」の行がある", !!noBook);
      if (noBook) {
        noBook.checked = true;
        noBook.dispatchEvent(new w.Event("change", { bubbles: true }));
      }
      step("★えらぶと「選んだ ◯教材」に変わる",
           $("xlsx-sum").textContent.includes("選んだ") && $("xlsx-ok").textContent.includes("選んだ"),
           $("xlsx-sum").textContent.replace(/\s+/g, " ").slice(0, 60));
      /* ★履歴は「前後で増えたか」で見る。複数の教科書をまとめて出すと
         quiz_set_id は null（どの回のものでもない）ので、回で引いても出てこない。
         2026-09-13 に、回で引く古い前提のまま落ちた。 */
      const expBefore = await w.__e2e.get(
        "/rest/v1/quiz_edit_log?select=id&action=eq.export&order=id.desc&limit=1");
      const expBeforeId = expBefore.length ? expBefore[0].id : 0;

      $("xlsx-ok").click();
      step("★えらんだ教科書を書き出せる",
           await until(() => $("xlsx-msg").textContent.includes("書き出しました"), 90000),
           $("xlsx-msg").textContent.replace(/\s+/g, " ").slice(0, 80));
      const expAfter = await w.__e2e.get(
        "/rest/v1/quiz_edit_log?select=id,summary&action=eq.export&order=id.desc&limit=1");
      step("★Excelに書き出したことが履歴に増えている",
           expAfter.length > 0 && expAfter[0].id > expBeforeId,
           "前=" + expBeforeId + " 後=" + (expAfter.length ? expAfter[0].id : "無し") +
           " / " + (expAfter.length ? expAfter[0].summary : ""));

      $("xlsx-cancel").click();
      await until(() => { const dl = $("xlsx-dlg"); return dl && !dl.open; }, 8000);

      const src = await w.__e2e.loadSet(setId);
      const r = w.__e2e.buildWb([src]);
      step("★Excelのブックを作れた（1回＝1シート）", r.sheets === 1, r.sheets + "シート");
      step("★設問の数がそろっている", r.questions === src.questions.length,
           r.questions + " / " + src.questions.length);

      const back = w.__e2e.reimport(r.wb);
      const rs = (back.sets || [])[0];
      step("★書き出したものを、そのまま取り込み口が読める", !!rs && !rs.error,
           rs ? (rs.error || "読めた") : "1シートも読めない");
      step("★不備0件で読める（＝そのまま戻せる）", !!rs && rs.dropped.length === 0,
           rs ? rs.dropped.length + "件" : "-");
      step("★往復しても設問の数が変わらない", !!rs && rs.questions.length === src.questions.length,
           (rs ? rs.questions.length : "-") + " / " + src.questions.length);

      // 1問ずつ中身を突き合わせる。★数が合うだけでは「中身が入れ替わっていない」と言えない
      let same = true, why = "";
      if (rs) {
        for (let i = 0; i < src.questions.length; i++) {
          const a = src.questions[i], b = rs.questions[i];
          if (!b) { same = false; why = "問" + a.seq + " が無い"; break; }
          if (a.seq !== b.seq) { same = false; why = "問題番号 " + a.seq + " → " + b.seq; break; }
          if (String(a.prompt) !== String(b.prompt)) { same = false; why = "問" + a.seq + " の設問文が変わった"; break; }
          if (a.choices.join("\u0001") !== b.choices.join("\u0001")) { same = false; why = "問" + a.seq + " の選択肢が変わった"; break; }
          if (a.correctIdx !== b.correctIdx) { same = false; why = "問" + a.seq + " の正解が " + a.correctIdx + " → " + b.correctIdx; break; }
        }
      } else same = false;
      step("🔴★往復しても中身が1問も変わらない（設問文・選択肢・正解）", same, why || "全部一致");
    }

    // ---- ⑧ 変更の履歴に載っているか（2026-09-13 きあ依頼）----
    // ★きあの言葉:「だれがいつ変更したかの変更履歴は取りたい」
    //   記録は **消せない**（DBに delete のポリシーを作っていない）ので、
    //   このテストが残した行もそのまま残る。隠さずに画面へ出す方を選んだ。
    {
      const logs = await w.__e2e.get(
        "/rest/v1/quiz_edit_log?select=action,quiz_set_title,summary,actor_id" +
        "&quiz_set_id=eq." + encodeURIComponent(setId) + "&order=at.desc&limit=20");
      const acts = logs.map(r => r.action);
      step("★編集したことが履歴に残っている", acts.indexOf("edit") >= 0, JSON.stringify(acts));
      step("★取り込んだことも履歴に残っている", acts.indexOf("import") >= 0, JSON.stringify(acts));
      step("★公開・停止も履歴に残っている",
           acts.indexOf("publish") >= 0 && acts.indexOf("unpublish") >= 0, JSON.stringify(acts));
      /* ⓘ export はここに出なくてよい＝複数の教科書をまとめて出すと
         「どの回のものでもない」ので quiz_set_id は null。増えたことは上で確かめている。 */
      step("★この回の履歴に、取り込み・編集・公開・停止がそろっている",
           ["import", "edit", "publish", "unpublish"].every(a => acts.indexOf(a) >= 0),
           JSON.stringify(acts));
      step("★だれが変えたかが入っている（空でない）",
           logs.length > 0 && logs.every(r => !!r.actor_id), logs.length + "件");
      step("★何をしたかが1行で読める",
           logs.length > 0 && logs.every(r => (r.summary || "").length > 0),
           logs.length ? logs[0].summary : "-");

      // 画面でも見られるか
      d.querySelector('[data-view="editlog"]').click();
      step("「変更の履歴」の画面に入る", await until(() => !d.getElementById("view-editlog").hidden, 8000));
      step("★履歴の行が画面に出る",
           await until(() => d.getElementById("log-body").querySelectorAll("tr").length > 0, 15000),
           d.getElementById("log-note").textContent);
      step("★この回の題名が履歴に見える",
           d.getElementById("log-body").textContent.includes(TITLE_PREFIX),
           d.getElementById("log-body").textContent.replace(/\s+/g, " ").slice(0, 80));
      // 一覧へ戻す（このあとの片付けが一覧を使う）
      d.querySelector('[data-view="qsets"]').click();
      await until(() => !d.getElementById("view-qsets").hidden, 8000);
      await backToList();
    }

    // ---- ⑨ 画面から落とす「作問シート」のテンプレート（2026-09-13 きあ指摘）----
    // 🔴 落としたテンプレを取り込むと **0件** になること。
    //    ここが崩れると、見本の3行が **本物の問題として学生に出る**。
    //    本物の SheetJS で組み立てて、本物の取り込み口に食わせる（スタブでは意味がない）。
    {
      const tpl = w.__e2e.buildTpl();
      step("★テンプレートのブックを作れる", !!tpl && (tpl.SheetNames||[]).length === 1,
           JSON.stringify(tpl && tpl.SheetNames));
      step("★シート名が「作問シート（コピーして使う）」",
           (tpl.SheetNames||[])[0] === "作問シート（コピーして使う）", (tpl.SheetNames||[])[0]);
      const back = w.__e2e.reimport(tpl);
      step("🔴★落としたテンプレートは、取り込むと0件になる（見本が本物にならない）",
           (back.sets||[]).length === 0,
           (back.sets||[]).length + "件 / " + JSON.stringify((back.warn||[]).slice(0,2)));
    }

    step("編集に入り直す（片付け前）", await openEdit());
    $("qs-btn-editcancel").click();
    step("「保存せずに一覧へ戻る」で一覧に戻れる",
         await until(() => !$("qs-pane-list").hidden, 10000));
    await backToList();
  }

  // ---- 絞り込み・検索（2026-09-11・きあ決定「教材で絞る＋名前で検索」）----
  // ★件数を決め打ちしない。「絞る前 ≧ 絞った後」「絞った結果が全部その教材/検索語」の形で見る
  //   （このダミーの件数は前回の残骸の有無で毎回変わりうるため）。
  // 🔴 教材（source_book）は quiz_sets にまだ無い環境もある（DBは別担当が進めている）。
  //   列が無ければ qs-filter-book / qp-filter-book は hidden のまま＝その場合は検索だけ確認して分岐する。
  {
    // ①一覧: 名前検索
    const beforeRows = $("qs-list-tbl").querySelectorAll("tr[data-qsid]").length;
    const noteBefore = $("qs-list-note").textContent;
    $("qs-filter-q").value = TITLE_PREFIX;
    $("qs-filter-q").dispatchEvent(new Event("input"));
    await until(() => $("qs-list-note").textContent !== noteBefore && $("qs-list-note").textContent !== "読み込み中…", 8000);
    await sleep(150);
    const afterRows = [...$("qs-list-tbl").querySelectorAll("tr[data-qsid]")];
    step("★一覧の名前検索: 絞る前 ≧ 絞った後", beforeRows > 0 && afterRows.length <= beforeRows,
         "前=" + beforeRows + " / 後=" + afterRows.length);
    step("★一覧の名前検索: 結果が1件以上あり、全部タイトルに検索語を含む",
         afterRows.length > 0 && afterRows.every(tr => tr.children[0].textContent.includes(TITLE_PREFIX)),
         afterRows.map(tr => tr.children[0].textContent).join("|").slice(0, 200));
    step("★一覧に件数の表示が出る（◯件を表示）", /件.*表示/.test($("qs-list-note").textContent), $("qs-list-note").textContent);

    // ①一覧: 教材フィルタ（列がある環境でだけ検証できる。無ければ「出ていない」ことだけ見て分岐）
    if (!$("qs-filter-book").hidden && $("qs-filter-book").options.length > 1) {
      $("qs-filter-q").value = ""; $("qs-filter-q").dispatchEvent(new Event("input"));
      await sleep(400);
      const beforeBook = $("qs-list-tbl").querySelectorAll("tr[data-qsid]").length;
      const book = $("qs-filter-book").options[1].value;
      $("qs-filter-book").value = book;
      $("qs-filter-book").dispatchEvent(new Event("change"));
      await until(() => $("qs-list-note").textContent !== "読み込み中…", 8000);
      await sleep(150);
      const afterBookIds = [...$("qs-list-tbl").querySelectorAll("tr[data-qsid]")].map(tr => tr.getAttribute("data-qsid"));
      step("★一覧の教材フィルタ: 絞る前 ≧ 絞った後", afterBookIds.length <= beforeBook,
           "前=" + beforeBook + " / 後=" + afterBookIds.length);
      // ★画面の行だけを見て自己採点しない。DBに直接聞いて「その教材のものだけか」を照合する
      const dbRows = await w.__e2e.get("/rest/v1/quiz_sets?select=id&source_book=eq." + encodeURIComponent(book) + "&limit=200");
      const dbIds = new Set(dbRows.map(r => r.id));
      step("★一覧の教材フィルタ: 画面の行が全部その教材のもの（DBに直接聞いて照合）",
           afterBookIds.length > 0 && afterBookIds.every(id => dbIds.has(id)),
           "画面=" + afterBookIds.length + "件 / DB直接=" + dbRows.length + "件");
      $("qs-filter-book").value = ""; $("qs-filter-book").dispatchEvent(new Event("change"));
      await sleep(400);
    } else if ($("qs-filter-book").hidden) {
      step("（教材フィルタは列が無いので出ていない＝列が無いときの正しい壊れ方。検索だけ確認した）", true,
           "qs-filter-book.hidden=" + $("qs-filter-book").hidden);
    } else {
      // 列はあるが source_book にまだ値が無い環境（マイグレーション直後）＝
      // セレクトは出るが「すべての教材」しか選べない。これも正しい壊れ方。
      step("（教材フィルタの列はあるが、まだ教材名の入ったデータが無い＝「すべての教材」だけ。検索だけ確認した）", true,
           "options=" + $("qs-filter-book").options.length);
    }
    // 検索欄を空に戻す（片付けの検索・以降の手順に影響しないように）
    $("qs-filter-q").value = ""; $("qs-filter-q").dispatchEvent(new Event("input"));
    await sleep(400);
  }

  {
    // ②「集計するテスト」（はじめるの下敷き・quiz-pick）にも同じ絞り込みが効くか
    d.querySelector('.nav [data-view="quiz"]').click();
    step("「小テスト ライブ集計」画面に入る", await until(() => !d.getElementById("view-quiz").hidden));
    await until(() => $("quiz-pick").options.length > 0, 8000);
    // まず空検索で読み直し、いまのDBの状態にそろえてから絞る前の候補数を数える
    $("qp-filter-q").value = ""; $("qp-filter-q").dispatchEvent(new Event("input"));
    await sleep(700);
    const beforeOpts = $("quiz-pick").options.length;
    const noteBeforeSearch = $("qp-filter-note").textContent;
    $("qp-filter-q").value = TITLE_PREFIX;
    $("qp-filter-q").dispatchEvent(new Event("input"));
    await until(() => $("qp-filter-note").textContent !== noteBeforeSearch, 8000);
    await sleep(150);
    const afterOpts = [...$("quiz-pick").options];
    step("★「集計するテスト」の名前検索: 絞る前 ≧ 絞った後",
         beforeOpts > 0 && afterOpts.length <= beforeOpts, "前=" + beforeOpts + " / 後=" + afterOpts.length);
    step("★「集計するテスト」の名前検索: 選択肢が1件以上あり、全部タイトルに検索語を含む",
         afterOpts.length > 0 && afterOpts.every(o => o.textContent.includes(TITLE_PREFIX)),
         afterOpts.map(o => o.textContent).join("|").slice(0, 200));
    // 検索を空に戻す（次に触る人が絞り込んだままにならないように）
    $("qp-filter-q").value = ""; $("qp-filter-q").dispatchEvent(new Event("input"));
    await sleep(400);
    // 片付け（一覧からの消去）へ戻る
    d.querySelector('.nav [data-view="qsets"]').click();
    await until(() => !$("qs-pane-list").hidden);
  }

  // ---- 片付け（ダミーを消す。消せたことまで確認する）----
  // ★w.api は const 宣言なので iframe外から拾えない。master.html が窓口として出している __e2e を使う。
  /* ═══ 「🗑 表示中をまとめて消す」（2026-09-13 きあ判断で行から移した）═══
     ★行から外したので、消す道はここだけ。**しぼっていないと受け付けない**ところが要。
       しぼり込みを忘れたまま押せると、全87回が一度に消える口になる。 */
  try {
    const $f = (id) => d.getElementById(id);
    $f("qs-filter-q").value = "";
    $f("qs-filter-q").dispatchEvent(new w.Event("input", { bubbles: true }));
    await sleep(600);
    await until(() => !( $f("qs-list-note").textContent || "" ).includes("しぼり"), 15000);
    $f("qs-btn-delmany").click();
    step("🔴★しぼっていないと、まとめて消せない",
         await until(() => ($f("qs-list-msg").textContent || "").includes("しぼってください"), 10000),
         ($f("qs-list-msg").textContent || "").slice(0, 60));

    // しぼれば消せる
    $f("qs-filter-q").value = TITLE_PREFIX;
    $f("qs-filter-q").dispatchEvent(new w.Event("input", { bubbles: true }));
    await sleep(600);
    await until(() => ($f("qs-list-note").textContent || "").includes("しぼり"), 15000);
    const before = await w.__e2e.get("/rest/v1/quiz_sets?select=id&title=like." +
                                     encodeURIComponent(TITLE_PREFIX + "*"));
    step("消す前にダミーが残っている", before.length > 0, before.length + "件");
    $f("qs-btn-delmany").click();
    const shown = await until(() => { const dl = $f("cfm-dlg"); return dl && dl.open; }, 10000);
    step("★まとめて消す前に確認ダイアログが出る", shown,
         shown ? $f("cfm-dlg").textContent.replace(/\s+/g, " ").slice(0, 80) : "出なかった");
    if (shown) {
      step("★確認に「消せるのは◯件」と出る",
           /消せるのは\s*\d+件/.test($f("cfm-dlg").textContent),
           $f("cfm-dlg").textContent.replace(/\s+/g, " ").slice(0, 90));
      $f("cfm-ok").click();
    }
    step("★まとめて消せた",
         await until(() => ($f("qs-list-msg").textContent || "").includes("消しました"), 30000),
         ($f("qs-list-msg").textContent || "").slice(0, 60));
    const after = await w.__e2e.get("/rest/v1/quiz_sets?select=id&title=like." +
                                    encodeURIComponent(TITLE_PREFIX + "*"));
    step("★DBからも消えている", after.length === 0, after.length + "件");
    $f("qs-filter-q").value = "";
    $f("qs-filter-q").dispatchEvent(new w.Event("input", { bubbles: true }));
    await sleep(600);
  } catch (e) { log.delManyError = (e && e.message) || String(e); }

  // 🔴 **見つかった全部を消して、残りが0件であることをタイトルで確かめる。**
  //   以前は rowsFound[0] の1件だけ消し、その1件のIDで確認していた。
  //   前の実行が残したダミーがあると「古いほうを消して、今回作ったぶんを残す」のに
  //   検査は通る＝**残骸が1件ずつ積み上がるのに気づけない**（2026-09-11 に実際に発生）。
  let cleaned = false, foundIds = [];
  try {
    const q = "title=like." + encodeURIComponent(TITLE_PREFIX + "*");
    const rowsFound = await w.__e2e.get("/rest/v1/quiz_sets?select=id,title&" + q);
    foundIds = rowsFound.map(r => r.id);
    for (const id of foundIds) {
      // 🔴 直接 DELETE しない。quiz_sets の cascade は受験記録まで巻き込み、しかも RLS を通らない。
      //    delete_quiz_set は受験記録が1件でもあれば断る＝**消してよい範囲だけ**に閉じてある。
      await w.__e2e.delSet(id);
    }
    // ★確認は「消したID」ではなく「ダミーの目印が付いた回が1件も残っていないか」で見る
    const left = await w.__e2e.get("/rest/v1/quiz_sets?select=id&" + q);
    cleaned = left.length === 0;
    if (!cleaned) log.cleanupLeft = left.length;
  } catch (e) { log.cleanupError = (e && e.message) || String(e); }
  step("★ダミーを消せた（残さない）", cleaned,
       foundIds.length + "件見つけて全部消した" + (log.cleanupLeft ? " / 残り" + log.cleanupLeft + "件" : ""));

  log.done = true;
  out.textContent = "E2E_RESULT " + JSON.stringify(log);
})().catch(e => { log.error = (e && e.message) || String(e); out.textContent = "E2E_RESULT " + JSON.stringify(log); });
</script>
</body></html>
