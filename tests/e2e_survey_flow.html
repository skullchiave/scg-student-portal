<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>e2e survey flow</title></head>
<body>
<iframe id="f" src="../src/index.html" width="420" height="900"></iframe>
<pre id="out">RUNNING</pre>
<!-- 資格情報は file:// から .env を読めないので、run_e2e_survey.py が書き出した tmp/e2e_creds.js から取る。
     ★無ければ window.__E2E_CREDS が undefined のままになる＝下の分岐で気づいて止まる（黙って落ちない）。 -->
<script src="../tmp/e2e_creds.js"></script>
<script>
/* 回帰テスト（tests/run_e2e_survey.py から起動）。学生画面をそのまま iframe で動かし、ログイン→アンケート一覧→回答→一覧に戻る までを実際に操作する。
   結果は #out に JSON で書く（--dump-dom で回収）。
   アカウントは負荷試験用 l150。回答は検査専用の定義 test_ui（本番の SURVEYS に無い＝どの画面にも出ない）に出すので、
   本物の4本の回答数を汚さない。パスワードは資格情報のみ .env 由来。
   ★鍵は**固定**（2026-09-11 に変更）。以前は test_multi_ui_<時刻> と毎回ちがう鍵にしていたため、
     消す口が無い survey_responses に行が9件たまっていた。固定にすると毎回おなじ回へ上書きされる。
     対応する「回」は db/2026-09-11_survey_rounds_phase2.sql が常設で1つ作る（題名「検査用」）。 */
const out = document.getElementById("out"), log = { steps: [] };
const step = (name, ok, detail) => log.steps.push({ name, ok: !!ok, detail: detail === undefined ? "" : String(detail).slice(0, 220) });
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function until(fn, ms = 20000) { const t0 = Date.now(); while (Date.now() - t0 < ms) { try { if (fn()) return true; } catch (e) {} await sleep(150); } return false; }
function rows(d) { return [...d.querySelectorAll("#survey-list .row")].map(r => (r.classList.contains("done") ? "[済]" : "[ ]") + r.querySelector(".nm").textContent.replace(/\s+/g, " ").trim()); }
const CREDS = window.__E2E_CREDS || null;
(async () => {
  if (!CREDS || !CREDS.studentPw) {
    log.error = "資格情報が読めません（tmp/e2e_creds.js が無いか不完全）。tests/run_e2e_survey.py から起動してください。";
    out.textContent = "E2E_RESULT " + JSON.stringify(log);
    return;
  }
  const f = document.getElementById("f");
  /* 🔴「要素がある」を「準備できた」と読み替えないこと（2026-09-11 に踏んだ）。
     ログインボタンは静的HTMLなので最初から存在するが、その onclick は
     アプリの巨大なスクリプトの終盤で代入される。存在だけで待って押すと
     **押しても何も起きず、例外もエラー文言も出ない**。
     「ログインできない」ではなく「ログインしていない」まま先へ進み、
     あとから別の呼び出しが 401 になって、原因から遠い場所で落ちる。
     ★待ち時間を延ばして直したことにしない。競合であって遅さではない。 */
  await until(() => {
    const dd = f.contentDocument;
    const b = dd && dd.getElementById("btn-login");
    return !!b && typeof b.onclick === "function";
  });
  const w = f.contentWindow, d = f.contentDocument;
  try { w.localStorage.clear(); } catch (e) {}
  const $ = id => d.getElementById(id);
  // 検査専用のアンケートを5本目として差し込む（がくひと同じ「select 3問」の形）
  w.eval("SURVEYS").push({ key: "test_ui", sb: "Test", color: "#888888",
    title: { ja: "じどうけんさの アンケート", en: "Self-check survey" }, desc: { ja: "e2e", en: "e2e" }, intro: { ja: "e2e", en: "e2e" },
    q: [ { k: "a", t: "select", l: { ja: "A", en: "A" }, sl: "A", o: [{ v: "1", ja: "いち", en: "one" }, { v: "2", ja: "に", en: "two" }] },
         { k: "b", t: "select", l: { ja: "B", en: "B" }, sl: "B", o: [{ v: "1", ja: "いち", en: "one" }, { v: "2", ja: "に", en: "two" }] },
         { k: "c", t: "select", l: { ja: "C", en: "C" }, sl: "C", o: [{ v: "1", ja: "いち", en: "one" }, { v: "2", ja: "に", en: "two" }] } ] });
  await until(() => !$("scr-login").hidden, 8000);
  step("login screen shown", !$("scr-login").hidden);
  $("in-no").value = "l150"; $("in-pw").value = CREDS.studentPw; $("btn-login").click();
  step("mypage shown after login", await until(() => !$("scr-mypage").hidden), $("login-msg").textContent);
  step("my-name", true, $("my-name").textContent);
  // 言語切替: 🌐 ボタンがあり、English にすると静的文言と動的文言が変わり、選択が保存される
  step("lang switch button present (ja)", !!$("langbtn") && $("langcur").textContent === "日本語", $("langcur") && $("langcur").textContent);
  w.eval('setLang("en")');
  await sleep(200);
  step("en: mypage strings switched", $("btn-gotest").textContent.includes("Take a quiz") && $("my-name").textContent.indexOf(" さん") < 0 && $("langcur").textContent === "English",
       $("btn-gotest").textContent.trim() + " / " + $("my-name").textContent + " / " + $("langcur").textContent);
  let saved = null; try { saved = w.localStorage.getItem("sp_lang"); } catch (e) {}
  step("en: choice is remembered (localStorage sp_lang)", saved === "en", saved);
  w.eval('setLang("ja")');
  await sleep(200);
  step("back to ja", $("btn-gotest").textContent.includes("テストを うける"), $("btn-gotest").textContent.trim());
  await sleep(1500); // survey map の読込を待つ
  // ★2026-09-11 の月次化以降、一覧に出るのは「いま自分に開いている回」なので、
  //   何行あるか・何件済みかは**その時のDBの状態しだい**。決め打ちにせず、前後の差で見る。
  const badgeBefore = $("survey-done-badge").textContent;
  step("badge is readable before", typeof badgeBefore === "string", "text=" + badgeBefore);
  $("btn-gosurvey").click();
  step("survey list shown", await until(() => !$("scr-surveylist").hidden), "");
  // ★一覧は「いま自分に開いている回」を取ってから作られる（非同期）。中身が入るまで待つ
  await until(() => d.querySelectorAll("#survey-list .row").length > 0, 15000);
  const before = rows(d);
  step("★検査用のアンケートが一覧に出る（回から引けている）",
       before.some(x => x.includes("じどうけんさ")), before.join(" | "));
  step("★本物の4本も一覧に出る（常設の回に紐づいている）",
       before.some(x => x.includes("しんろ")), before.join(" | "));
  const target = [...d.querySelectorAll("#survey-list .row")].find(r => r.textContent.includes("じどうけんさ"));
  target.click();
  step("survey form shown", await until(() => !$("scr-survey").hidden), $("survey-title").textContent);
  const selects = [...d.querySelectorAll("#survey-fields select")];
  step("form has 3 selects", selects.length === 3, selects.length);
  // 未回答のまま送信 → エラー表示
  // ★前の実行で答えた回を開くと選択肢が埋まっている（回モデルでは毎回おなじ回へ上書きするため）。
  //   「空のまま出したら断られる」を見たいので、いったん空へ戻す。
  selects.forEach(s => { s.selectedIndex = 0; });
  $("btn-survey-submit").click();
  await sleep(300);
  step("empty submit is rejected", $("survey-msg").textContent.includes("1つ以上"), $("survey-msg").textContent);
  selects.forEach(s => { s.selectedIndex = 1; });
  $("btn-survey-submit").click();
  step("back to list after submit", await until(() => !$("scr-surveylist").hidden && $("surveylist-msg").textContent.includes("うけとりました"), 25000), $("survey-msg").textContent + " / " + $("surveylist-msg").textContent);
  const after = rows(d);
  // ★行数を決め打ちにしない（開いている回の数はDBの状態しだい）。**並びの規則**を見る＝
  //   まだのもの → ていしゅつ済み の順。境目より後ろに [ ] が無ければ正しい。
  const firstDone = after.findIndex(x => x.startsWith("[済]"));
  step("答えたものが下へ沈む（まだ→済みの順）",
       firstDone === -1 || after.slice(firstDone).every(x => x.startsWith("[済]")), after.join(" | "));
  step("答えた回に「ていしゅつ済み」が付く",
       after.some(x => x.startsWith("[済]") && x.includes("じどうけんさ") && x.includes("ていしゅつ済み")),
       after.join(" | "));
  // 英語に切り替えても並びと状態は同じで、文言だけ変わる（保存値は言語に依らない）
  w.eval('setLang("en")'); await sleep(200);
  const afterEn = rows(d);
  step("en: 並びと状態は同じで、文言だけ英語になる",
       afterEn.length === after.length && afterEn[0].includes("Career") &&
       afterEn.some(x => x.startsWith("[済]") && x.includes("Self-check") && x.includes("Submitted")),
       afterEn.join(" | "));
  w.eval('setLang("ja")'); await sleep(200);
  step("本物の4本はまだ未回答のまま上にある",
       ["しんろ", "すまい", "けんこう", "がくひ"].every(k =>
         after.some(x => x.startsWith("[ ]") && x.includes(k))), after.join(" | "));
  // 再度開くと前回の答えが入っていて「なおして そうしん」になる
  [...d.querySelectorAll("#survey-list .row")].find(r => r.textContent.includes("じどうけんさ")).click();
  await until(() => !$("scr-survey").hidden);
  const sel2 = [...d.querySelectorAll("#survey-fields select")];
  step("reopen: previous answers prefilled + button label", sel2.every(s => s.selectedIndex === 1) && $("btn-survey-submit").textContent.includes("なおして"), $("btn-survey-submit").textContent + " / " + $("survey-msg").textContent);
  $("btn-survey-back").click();
  await until(() => !$("scr-surveylist").hidden);
  d.querySelector("#scr-surveylist [data-back]").click();
  step("back to mypage", await until(() => !$("scr-mypage").hidden), "");
  // ★バッジの数字も決め打ちにしない。**一覧の実際の数と合っているか**で見る
  const doneN = after.filter(x => x.startsWith("[済]")).length;
  // ★言語によって区切りが「／」と「/」で変わるので、**数字だけ**で見る。
  //   ⚠ 文言そのものは下の「言語が残っていない」で別に見る
  const badgeNums = ($("survey-done-badge").textContent.match(/\d+/g) || []).join(",");
  step("バッジの数字が一覧の実際の数と合う",
       $("survey-done-badge").hidden === false && badgeNums === doneN + "," + after.length,
       "text=" + $("survey-done-badge").textContent + " / 一覧は " + doneN + "／" + after.length);
  // ★アンケート一覧で英語にして戻ってきた直後。バッジに前の言語が残っていないこと
  step("バッジに前の言語が残っていない（日本語に戻っている）",
       $("survey-done-badge").textContent.includes("ていしゅつ"),
       $("survey-done-badge").textContent);
  $("btn-gosurvey").click();
  step("btn-gosurvey (= #survey deep link) opens list", await until(() => !$("scr-surveylist").hidden), "");
  // ★ここも一覧の取得は非同期。中身が入るまで待つ
  await until(() => d.querySelectorAll("#survey-list .row").length > 0, 15000);
  // 本物の しんろ を開いて既存形式（text/select/text）が組み上がるか
  // ★日本語／英語のどちらでも見つかるようにする（バッジが英語のまま残る場合があるため）
  const shinroRow = [...d.querySelectorAll("#survey-list .row")]
    .find(r => r.textContent.includes("しんろ") || r.textContent.includes("Career"));
  step("しんろアンケートの行がある", !!shinroRow, rows(d).join(" | "));
  shinroRow.click();
  await until(() => !$("scr-survey").hidden);
  const kinds = [...d.querySelectorAll("#survey-fields .field")].map(x => x.querySelector("select") ? "select" : "text");
  step("shinro form = text/select/text with 10 options", kinds.join(",") === "text,select,text" && d.querySelectorAll("#survey-fields select option").length === 11, kinds.join(",") + " options=" + d.querySelectorAll("#survey-fields select option").length);
  log.done = true;
  out.textContent = "E2E_RESULT " + JSON.stringify(log);
})().catch(e => { log.error = String(e); out.textContent = "E2E_RESULT " + JSON.stringify(log); });
</script>
</body></html>
