<!doctype html><html lang="ja"><head><meta charset="utf-8">
<title>撮影中</title>
<style>html,body{margin:0;padding:0;background:#fff}iframe{border:0;display:block}</style>
</head><body>
<iframe id="fr" src="../src/master.html" width="1600" height="1040"></iframe>
<script src="e2e_creds.js"></script>
<script>
/* master.html の見え方を撮るためだけのハーネス（2026-09-13・使い捨て）。
   🔴 DBは読むだけ。公開や保存のボタンは押さない。 */
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function until(fn, ms = 25000) {
  const t0 = Date.now();
  while (Date.now() - t0 < ms) { try { if (fn()) return true; } catch (e) {} await sleep(150); }
  return false;
}
(async () => {
  const fr = document.getElementById("fr");
  await until(() => fr.contentDocument && fr.contentDocument.getElementById("btn-login"));
  const w = fr.contentWindow, d = fr.contentDocument, $ = id => d.getElementById(id);
  await until(() => typeof $("btn-login").onclick === "function", 25000);
  if (!window.__E2E_CREDS) { document.title = "NG-creds"; return; }

  const mode = (location.hash || "#list").replace("#", "");
  $("in-no").value = window.__E2E_CREDS.masterNo;
  $("in-pw").value = window.__E2E_CREDS.masterPw;
  $("btn-login").click();
  if (!await until(() => !$("scr-dash").hidden, 30000)) { document.title = "NG-login"; return; }

  d.querySelector('[data-view="qsets"]').click();
  await until(() => !$("qs-pane-list").hidden, 15000);
  await until(() => $("qs-list-tbl").querySelectorAll("tr[data-qsid]").length > 0, 25000);
  await sleep(900);

  if (mode === "xlsx") {
    $("qs-btn-export").click();
    await until(() => d.querySelectorAll(".xlsx-book").length > 0, 25000);
    await sleep(500);
  }
  if (mode === "book") {
    // 教材でしぼった状態（件数の見え方を確かめる）
    const sel = $("qs-filter-book");
    const opt = [...sel.options].filter(o => o.value)[0];
    if (opt) { sel.value = opt.value; sel.dispatchEvent(new w.Event("change", { bubbles: true })); }
    await sleep(1500);
  }
  document.title = "READY";
})();
</script>
</body></html>
